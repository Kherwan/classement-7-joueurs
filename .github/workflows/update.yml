name: Mise à jour du classement

on:
  schedule:
    - cron: "1 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer le classement
        env:
          PLAYERS: "Elisa13,Kerwan"
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          API = "https://api.latabledessavoirs.fr/leaderboards/season/8/facile/search"

          players = [
              p.strip()
              for p in os.environ["PLAYERS"].split(",")
              if p.strip()
          ]

          results = []

          for username in players:
              url = API + "?q=" + urllib.parse.quote(username)

              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data = json.load(response)

                  exact = next(
                      (
                          player for player in data
                          if player.get("username", "").lower() == username.lower()
                      ),
                      None
                  )

                  player = exact or (data[0] if data else None)

                  if player:
                      results.append({
                          "username": player.get("username", username),
                          "score": player.get("score"),
                          "rank": player.get("rank")
                      })
                  else:
                      results.append({
                          "username": username,
                          "error": "Joueur introuvable"
                      })

              except Exception as e:
                  results.append({
                      "username": username,
                      "error": str(e)
                  })

          results.sort(
              key=lambda p: (
                  p.get("rank") is None,
                  p.get("rank") or 10**12
              )
          )

          output = {
              "season": 8,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "players": results
          }

          with open("classement.json", "w", encoding="utf-8") as f:
              json.dump(output, f, ensure_ascii=False, indent=2)

          print(json.dumps(output, ensure_ascii=False, indent=2))
          PY

      - name: Publier la mise à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add classement.json
          git diff --cached --quiet || git commit -m "Mise à jour du classement"
          git push
