name: Mise à jour du classement

on:
  schedule:
    - cron: "1 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Mettre à jour le classement
        run: python update_classement.py

      - name: Publier le nouveau classement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add classement.json

          if git diff --cached --quiet; then
            echo "Aucune modification du classement."
          else
            git commit -m "Mise à jour du classement"
            git push
          fi
