<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Questions des jours précédents</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #0066cc;
        }

        .day {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .day h2 {
            margin-top: 0;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .question {
            border-bottom: 1px solid #eee;
            padding: 18px 0;
        }

        .question:last-child {
            border-bottom: none;
        }

        .number {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .answer {
            margin-top: 10px;
            font-weight: bold;
            background: #eef8ee;
            padding: 10px;
            border-radius: 8px;
        }

        .loading {
            text-align: center;
            padding: 30px;
        }

        .error {
            background: #ffecec;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back" href="index.html">
        ← Retour au classement
    </a>

    <h1>📚 Questions des jours précédents</h1>

    <div id="content" class="loading">
        Chargement...
    </div>

</div>

<script>

fetch("questions.json")
    .then(response => {
        if (!response.ok) {
            throw new Error("Impossible de charger questions.json");
        }

        return response.json();
    })

    .then(data => {

        const content = document.getElementById("content");

        content.innerHTML = "";

        data.days.forEach(day => {

            const dayElement = document.createElement("div");
            dayElement.className = "day";

            const title = document.createElement("h2");
            title.textContent = "📅 " + day.date;

            dayElement.appendChild(title);

            day.questions.forEach((item, index) => {

                const questionElement =
                    document.createElement("div");

                questionElement.className = "question";

                questionElement.innerHTML = `
                    <div class="number">
                        Question ${index + 1}
                    </div>

                    <div>
                        ${escapeHtml(item.question)}
                    </div>

                    <div class="answer">
                        ✅ Réponse : ${escapeHtml(item.answer)}
                    </div>
                `;

                dayElement.appendChild(questionElement);
            });

            content.appendChild(dayElement);
        });

    })

    .catch(error => {

        document.getElementById("content").innerHTML = `
            <div class="error">
                ❌ ${error.message}
            </div>
        `;

    });


function escapeHtml(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
