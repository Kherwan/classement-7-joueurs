<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions des jours précédents — Table des Savoirs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:        #1c2b20;
    --ink-soft:   #26392c;
    --paper:      #f2ead4;
    --paper-dim:  #e7dcb9;
    --line:       #cdbd8f;
    --text:       #2a2013;
    --text-dim:   #6b5f47;
    --brass:      #a9762f;
    --brass-dark: #7c5722;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 56px 20px 90px;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, var(--ink-soft), transparent 55%);
    color: var(--text);
    font-family: "Source Serif 4", Georgia, serif;
  }

  .page {
    max-width: 700px;
    margin: 0 auto;
  }

  .back {
    display: inline-block;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--paper-dim);
    text-decoration: none;
    border-bottom: 1px solid transparent;
    margin-bottom: 40px;
  }

  .back:hover {
    border-bottom-color: var(--paper-dim);
  }

  .masthead {
    text-align: left;
    margin-bottom: 48px;
    color: var(--paper);
  }

  .masthead h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1.05;
    margin: 0 0 10px;
  }

  .masthead p {
    margin: 0;
    max-width: 46ch;
    color: var(--paper-dim);
    font-size: 16px;
    line-height: 1.5;
  }

  .status {
    color: var(--paper-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
  }

  .error {
    background: #3a2420;
    color: #f2d9d0;
    padding: 16px 18px;
    border-left: 3px solid #b25c48;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
  }

  /* --- Fiches d'archive --- */

  .archive {
    display: flex;
    flex-direction: column;
    gap: 34px;
  }

  .day-card {
    display: flex;
    align-items: stretch;
  }

  .day-tab {
    flex: 0 0 108px;
    background: var(--brass);
    color: var(--ink);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    line-height: 1.35;
    padding: 14px 12px;
    display: flex;
    align-items: flex-end;
    border-radius: 3px 0 0 3px;
  }

  .day-body {
    flex: 1;
    background: var(--paper);
    border-radius: 0 3px 3px 0;
    padding: 22px 26px 8px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
  }

  .entry {
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }

  .entry:first-child {
    border-top: none;
    padding-top: 4px;
  }

  .q {
    margin: 0 0 8px;
    font-size: 16.5px;
    line-height: 1.5;
  }

  .q-index {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--brass-dark);
    margin-right: 8px;
    vertical-align: 2px;
  }

  .a {
    margin: 0;
    padding-left: 4px;
    border-left: 2px solid var(--brass);
    padding-left: 12px;
    font-size: 15.5px;
    line-height: 1.55;
    color: var(--text);
  }

  .a-mark {
    font-style: italic;
    color: var(--brass-dark);
    margin-right: 6px;
  }

  @media (max-width: 560px) {
    body { padding: 40px 14px 70px; }
    .masthead h1 { font-size: 33px; }
    .day-card { flex-direction: column; }
    .day-tab {
      flex: none;
      border-radius: 3px 3px 0 0;
      align-items: center;
    }
    .day-body {
      border-radius: 0 0 3px 3px;
    }
  }
</style>
</head>

<body>

<div class="page">

  <a class="back" href="index.html">&larr; Retour au classement</a>

  <div class="masthead">
    <h1>Archives</h1>
    <p>Les questions et réponses des jours précédents, Table des Savoirs.</p>
  </div>

  <div id="content" class="status">Chargement…</div>

</div>

<script>

fetch("questions.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Impossible de charger questions.json");
    }
    return response.json();
  })
  .then(data => {

    const content = document.getElementById("content");
    content.className = "archive";
    content.innerHTML = "";

    data.days.forEach(day => {

      const card = document.createElement("div");
      card.className = "day-card";

      const tab = document.createElement("div");
      tab.className = "day-tab";
      tab.textContent = day.date;

      const body = document.createElement("div");
      body.className = "day-body";

      day.questions.forEach((item, index) => {

        const entry = document.createElement("div");
        entry.className = "entry";

        entry.innerHTML = `
          <p class="q"><span class="q-index">${String(index + 1).padStart(2, "0")}</span>${escapeHtml(item.question)}</p>
          <p class="a"><span class="a-mark">Réponse</span>${escapeHtml(item.answer)}</p>
        `;

        body.appendChild(entry);
      });

      card.appendChild(tab);
      card.appendChild(body);
      content.appendChild(card);
    });

  })
  .catch(error => {
    const content = document.getElementById("content");
    content.className = "";
    content.innerHTML = `<div class="error">Erreur : ${error.message}</div>`;
  });

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
</html>
