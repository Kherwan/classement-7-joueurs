<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questions des jours précédents — Table des Savoirs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:      #fdfbf3;
    --ink:     #26303d;
    --ink-dim: #6b7280;
    --card:    #ffffff;
    --line:    #ece5d3;

    --blue:    #3374ac;
    --pink:    #e1507e;
    --yellow:  #eab834;
    --green:   #4c9a6a;
    --orange:  #e77f34;
    --purple:  #8a5fac;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 50px 18px 90px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.15;
    z-index: 0;
  }

  body::before {
    background: var(--yellow);
    top: -170px;
    right: -150px;
  }

  body::after {
    background: var(--green);
    top: 60px;
    left: -200px;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 30px;
    color: var(--ink-dim);
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
  }

  .back::before { content: "←"; }

  .back:hover { color: var(--ink); }

  .masthead {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
  }

  .wheel {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    flex: none;
    background: conic-gradient(
      var(--blue) 0deg 60deg,
      var(--pink) 60deg 120deg,
      var(--yellow) 120deg 180deg,
      var(--green) 180deg 240deg,
      var(--orange) 240deg 300deg,
      var(--purple) 300deg 360deg
    );
    box-shadow: 0 0 0 4px #fff, 0 2px 8px rgba(38,48,61,0.18);
  }

  .masthead h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    line-height: 1;
  }

  .subtitle {
    margin: 10px 0 34px;
    color: var(--ink-dim);
    font-size: 15px;
    max-width: 48ch;
  }

  .status {
    color: var(--ink-dim);
    font-size: 14px;
    padding: 20px 4px;
  }

  .error {
    background: #fbe6e2;
    color: #93372a;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
  }

  /* --- Journées --- */

  .archive {
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .day-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
  }

  .day-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 22px;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 16px;
  }

  .day-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex: none;
  }

  .entry {
    padding: 16px 22px;
    border-top: 1px solid var(--line);
    display: flex;
    gap: 12px;
  }

  .q-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
    margin-top: 8px;
  }

  .entry-body {
    flex: 1;
  }

  .q {
    margin: 0 0 8px;
    font-size: 15.5px;
    line-height: 1.5;
  }

  .a {
    margin: 0;
    font-size: 14.5px;
    line-height: 1.55;
    color: var(--ink-dim);
    background: #f7f4ea;
    border-radius: 10px;
    padding: 10px 14px;
  }

  .a-mark {
    font-weight: 600;
    color: var(--ink);
    margin-right: 6px;
  }

  @media (max-width: 480px) {
    .masthead h1 { font-size: 27px; }
    .wheel { width: 34px; height: 34px; }
  }
</style>
</head>

<body>

<div class="page">

  <a class="back" href="index.html">Retour au classement</a>

  <div class="masthead">
    <div class="wheel"></div>
    <h1>Archives</h1>
  </div>
  <p class="subtitle">Les questions et réponses des jours précédents, Table des Savoirs.</p>

  <div id="content" class="status">Chargement…</div>

</div>

<script>

const WHEEL = ["#3374ac", "#e1507e", "#eab834", "#4c9a6a", "#e77f34", "#8a5fac"];

fetch("questions.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Impossible de charger questions.json");
    }
    return response.json();
  })
  .then(data => {

    const content = document.getElementById("content");
    content.className = "archive";
    content.innerHTML = "";

    data.days.forEach((day, dayIndex) => {

      const card = document.createElement("div");
      card.className = "day-card";

      const head = document.createElement("div");
      head.className = "day-head";
      head.innerHTML = `<span class="day-dot" style="background:${WHEEL[dayIndex % WHEEL.length]}"></span>${escapeHtml(day.date)}`;
      card.appendChild(head);

      day.questions.forEach((item, index) => {

        const entry = document.createElement("div");
        entry.className = "entry";

        entry.innerHTML = `
          <span class="q-dot" style="background:${WHEEL[index % WHEEL.length]}"></span>
          <div class="entry-body">
            <p class="q">${escapeHtml(item.question)}</p>
            <p class="a"><span class="a-mark">Réponse</span>${escapeHtml(item.answer)}</p>
          </div>
        `;

        card.appendChild(entry);
      });

      content.appendChild(card);
    });

  })
  .catch(error => {
    const content = document.getElementById("content");
    content.className = "";
    content.innerHTML = `<div class="error">Erreur : ${error.message}</div>`;
  });

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

</script>

</body>
</html>
