<body>

<div class="container">

    <a href="index.html" class="back">
        ← Retour au classement
    </a>

    <h1>📚 Ajouter les questions</h1>

    <p>
        Colle ici directement le texte copié depuis
        La Table des Savoirs.
    </p>

    <label for="date">Date</label>

    <input
        type="text"
        id="date"
        placeholder="Exemple : 27 août 2026"
    >

    <br><br>

    <label for="content">
        Questions + réponses
    </label>

    <textarea
        id="content"
        placeholder="Colle ici les questions et les réponses..."
    ></textarea>

    <button onclick="analyser()">
        🔍 Analyser
    </button>

    <div id="result" class="result"></div>

    <div id="preview" class="preview"></div>

</div>

<script>

function analyser() {

    const content =
        document.getElementById("content").value;

    const result =
        document.getElementById("result");

    const preview =
        document.getElementById("preview");

    result.style.display = "none";
    preview.innerHTML = "";

    if (!content.trim()) {

        result.className = "result error";
        result.style.display = "block";

        result.innerHTML =
            "❌ Colle d'abord les questions et réponses.";

        return;
    }

    /*
     * On découpe le texte autour de
     * "Réponse attendue".
     *
     * Cela fonctionne même si la question
     * contient plusieurs lignes.
     */

    const answerRegex =
        /\*\*Réponse attendue\s*:\s*([\s\S]*?)\*\*/gi;

    const answers = [];

    let match;

    while ((match = answerRegex.exec(content)) !== null) {

        answers.push(
            match[1]
                .replace(/\r/g, "")
                .trim()
        );
    }

    /*
     * Pour trouver les questions, on prend
     * le texte situé avant chaque réponse.
     */

    const questions = [];

    const parts = content.split(
        /\*\*Réponse attendue\s*:\s*[\s\S]*?\*\*/gi
    );

    for (let i = 0; i < answers.length; i++) {

        let part = parts[i];

        /*
         * On récupère ce qui suit la question précédente.
         */

        const blocks = part
            .split(/\n\s*\n/)
            .map(x => x.trim())
            .filter(Boolean);

        let question = "";

        /*
         * On cherche le dernier bloc pertinent.
         */

        for (let j = blocks.length - 1; j >= 0; j--) {

            const candidate = blocks[j];

            if (
                !candidate.includes("Pas de réponse") &&
                !candidate.match(/^\*\*.*\/\s*30\s*pts\*\*$/i)
            ) {

                question = candidate
                    .replace(/\*\*/g, "")
                    .trim();

                break;
            }
        }

        questions.push(question);
    }

    const questionCount = questions.length;
    const answerCount = answers.length;

    result.style.display = "block";

    if (
        questionCount === 10 &&
        answerCount === 10 &&
        questions.every(q => q.length > 5)
    ) {

        result.className = "result success";

        result.innerHTML = `
            ✅ <strong>10 questions détectées</strong><br>
            ✅ <strong>10 réponses détectées</strong><br><br>
            Vérifie l'aperçu ci-dessous.
        `;

    } else {

        result.className = "result error";

        result.innerHTML = `
            ⚠️ <strong>Attention</strong><br><br>
            Questions détectées : ${questionCount}<br>
            Réponses détectées : ${answerCount}<br><br>
            Il faut normalement 10 questions et 10 réponses.
        `;
    }

    /*
     * Affichage de l'aperçu
     */

    if (questions.length > 0) {

        preview.innerHTML =
            "<h2>👀 Aperçu</h2>";

        questions.forEach((question, index) => {

            const div =
                document.createElement("div");

            div.className = "question";

            div.innerHTML = `
                <div class="question-number">
                    Question ${index + 1}
                </div>

                <div>
                    ${escapeHtml(question)}
                </div>

                <div class="answer">
                    Réponse :
                    ${escapeHtml(answers[index] || "?")}
                </div>
            `;

            preview.appendChild(div);
        });
    }
}


/*
 * Empêche le texte collé de pouvoir interpréter
 * du HTML dans l'aperçu.
 */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}

</script>

</body>
</html>
