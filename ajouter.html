<body>

<div class="container">

    <a href="index.html" class="back">
        ← Retour au classement
    </a>

    <h1>📚 Ajouter les questions</h1>

    <p class="description">
        Colle ici les questions copiées depuis La Table des Savoirs.
        La page récupérera automatiquement les bonnes réponses.
    </p>

    <label for="date">Date</label>

    <input
        type="text"
        id="date"
        placeholder="Exemple : 27 août 2026"
    >

    <br><br>

    <label for="content">
        Questions + réponses
    </label>

    <textarea
        id="content"
        placeholder="Colle ici le contenu du quiz..."
    ></textarea>

    <button onclick="analyser()">
        🔍 Analyser
    </button>

    <div id="result" class="result"></div>

    <div id="preview" class="preview"></div>

    <div id="jsonSection" class="json-section">

        <h2>📄 JSON généré</h2>

        <textarea
            id="jsonOutput"
            readonly
        ></textarea>

        <button
            class="secondary"
            onclick="copierJSON()"
        >
            📋 Copier le JSON
        </button>

        <div id="copySuccess" class="copy-success">
            ✅ JSON copié !
        </div>

    </div>

</div>


<script>

let questionsDetectees = [];
let answersDetectees = [];


/* =====================================================
   ANALYSE
   ===================================================== */

function analyser() {

    const texte =
        document.getElementById("content").value;

    const date =
        document.getElementById("date").value.trim();

    const result =
        document.getElementById("result");

    const preview =
        document.getElementById("preview");

    const jsonSection =
        document.getElementById("jsonSection");


    questionsDetectees = [];
    answersDetectees = [];

    result.style.display = "none";
    preview.innerHTML = "";
    jsonSection.style.display = "none";


    if (!texte.trim()) {

        afficherErreur(
            "❌ Colle d'abord le contenu du quiz."
        );

        return;
    }


    /*
     * -------------------------------------------------
     * NETTOYAGE DU TEXTE
     * -------------------------------------------------
     */

    const lignes = texte
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .map(ligne => ligne.trim());


    /*
     * -------------------------------------------------
     * ON CHERCHE LES REPONSES OFFICIELLES
     * -------------------------------------------------
     *
     * Deux possibilités :
     *
     * Réponse attendue : Edgar Degas
     *
     * Bonne réponse ! (Tee)
     *
     */


    let positionsReponses = [];


    for (let i = 0; i < lignes.length; i++) {

        const ligne = lignes[i];


        /*
         * Réponse attendue
         */

        const attendu =
            ligne.match(
                /^Réponse\s+attendue\s*:\s*(.+)$/i
            );


        if (attendu) {

            positionsReponses.push({

                index: i,

                answer:
                    nettoyerTexte(
                        attendu[1]
                    )

            });

            continue;
        }


        /*
         * Bonne réponse
         */

        const bonne =
            ligne.match(
                /^Bonne\s+réponse\s*!\s*\((.*?)\)/i
            );


        if (bonne) {

            positionsReponses.push({

                index: i,

                answer:
                    nettoyerTexte(
                        bonne[1]
                    )

            });
        }
    }


    /*
     * -------------------------------------------------
     * POUR CHAQUE REPONSE, ON REMONTE POUR TROUVER
     * LA QUESTION CORRESPONDANTE.
     * -------------------------------------------------
     */


    for (
        let r = 0;
        r < positionsReponses.length;
        r++
    ) {

        const position =
            positionsReponses[r];


        let question = "";


        /*
         * On remonte depuis la réponse.
         */

        for (
            let i = position.index - 1;
            i >= 0;
            i--
        ) {

            const ligne =
                lignes[i];


            if (!ligne) {
                continue;
            }


            /*
             * On ignore :
             *
             * - réponse utilisateur en gras
             * - scores
             * - pourcentages
             * - contestation
             * - bonne réponse
             */


            if (
                estLigneInutile(ligne)
            ) {

                continue;
            }


            /*
             * La première vraie ligne rencontrée
             * est la question.
             */

            question =
                nettoyerQuestion(ligne);

            break;
        }


        /*
         * Si on a trouvé une question et une réponse,
         * on l'ajoute.
         */

        if (
            question &&
            position.answer
        ) {

            questionsDetectees.push(question);

            answersDetectees.push(
                position.answer
            );
        }
    }


    /*
     * -------------------------------------------------
     * EVITER LES DOUBLONS
     * -------------------------------------------------
     */

    const resultatFinal = [];

    for (
        let i = 0;
        i < questionsDetectees.length;
        i++
    ) {

        const existe =
            resultatFinal.some(
                item =>
                    item.question ===
                    questionsDetectees[i]
            );


        if (!existe) {

            resultatFinal.push({

                question:
                    questionsDetectees[i],

                answer:
                    answersDetectees[i]

            });
        }
    }


    questionsDetectees =
        resultatFinal.map(
            item => item.question
        );

    answersDetectees =
        resultatFinal.map(
            item => item.answer
        );


    /*
     * -------------------------------------------------
     * AFFICHAGE
     * -------------------------------------------------
     */

    afficherResultat(date);
}


/* =====================================================
   LIGNE INUTILE ?
   ===================================================== */

function estLigneInutile(ligne) {

    const texte =
        ligne
            .replace(/\*\*/g, "")
            .trim();


    if (!texte) {
        return true;
    }


    /*
     * Réponse utilisateur :
     *
     * **Renoir**
     * **Tee**
     */

    if (
        ligne.startsWith("**") &&
        ligne.endsWith("**")
    ) {

        return true;
    }


    /*
     * Scores
     */

    if (
        /\d+\s*\/\s*\**30\s*pts/i
            .test(texte)
    ) {

        return true;
    }


    /*
     * Scores avec 100
     */

    if (
        /\d+\s*\/\s*\**100\s*pts/i
            .test(texte)
    ) {

        return true;
    }


    /*
     * Pourcentages
     */

    if (
        /^\d+[,.]\d+\s*%$/.test(texte)
    ) {

        return true;
    }


    /*
     * Contestation
     */

    if (
        texte
            .toLowerCase()
            .includes(
                "contestation en cours"
            )
    ) {

        return true;
    }


    /*
     * Réponse attendue
     */

    if (
        /^Réponse\s+attendue\s*:/i
            .test(texte)
    ) {

        return true;
    }


    /*
     * Bonne réponse
     */

    if (
        /^Bonne\s+réponse/i
            .test(texte)
    ) {

        return true;
    }


    /*
     * Pourcentage collé au reste
     */

    if (
        /^\d+[,.]\d+\s*%/.test(texte)
    ) {

        return true;
    }


    return false;
}


/* =====================================================
   NETTOYAGE
   ===================================================== */

function nettoyerTexte(texte) {

    return texte
        .replace(/\*\*/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


function nettoyerQuestion(texte) {

    return texte
        .replace(/\*\*/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/* =====================================================
   RESULTAT
   ===================================================== */

function afficherResultat(date) {

    const result =
        document.getElementById("result");


    result.style.display = "block";


    if (
        questionsDetectees.length === 10
    ) {

        result.className =
            "result success";


        result.innerHTML = `
            ✅ <strong>10 questions détectées !</strong><br>
            ✅ <strong>10 bonnes réponses détectées !</strong><br><br>
            Les réponses personnelles ont été ignorées.
        `;

    } else {

        result.className =
            "result error";


        result.innerHTML = `
            ⚠️ <strong>Détection incomplète</strong><br><br>

            Questions détectées :
            <strong>${questionsDetectees.length}</strong><br>

            Bonnes réponses détectées :
            <strong>${answersDetectees.length}</strong><br><br>

            Il faut normalement 10 questions et
            10 bonnes réponses.
        `;
    }


    afficherPreview();


    if (
        questionsDetectees.length > 0
    ) {

        genererJSON(date);
    }
}


/* =====================================================
   APERCU
   ===================================================== */

function afficherPreview() {

    const preview =
        document.getElementById("preview");


    if (
        questionsDetectees.length === 0
    ) {

        return;
    }


    preview.innerHTML =
        "<h2>👀 Aperçu</h2>";


    questionsDetectees.forEach(
        (question, index) => {

            const bloc =
                document.createElement(
                    "div"
                );


            bloc.className =
                "question";


            bloc.innerHTML = `

                <div class="number">
                    Question ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHtml(question)}
                </div>

                <div class="answer">
                    Réponse :
                    ${escapeHtml(
                        answersDetectees[index]
                    )}
                </div>

            `;


            preview.appendChild(bloc);
        }
    );
}


/* =====================================================
   JSON
   ===================================================== */

function genererJSON(date) {

    const jsonSection =
        document.getElementById(
            "jsonSection"
        );


    const jsonOutput =
        document.getElementById(
            "jsonOutput"
        );


    const jour = {

        date:
            date ||
            "Date inconnue",

        questions:
            questionsDetectees.map(
                (question, index) => {

                    return {

                        question:
                            question,

                        answer:
                            answersDetectees[index]

                    };
                }
            )
    };


    jsonOutput.value =
        JSON.stringify(
            jour,
            null,
            2
        );


    jsonSection.style.display =
        "block";
}


/* =====================================================
   COPIER
   ===================================================== */

async function copierJSON() {

    const json =
        document.getElementById(
            "jsonOutput"
        ).value;


    const message =
        document.getElementById(
            "copySuccess"
        );


    try {

        await navigator.clipboard.writeText(
            json
        );

    } catch (error) {

        const textarea =
            document.getElementById(
                "jsonOutput"
            );

        textarea.select();

        document.execCommand("copy");
    }


    message.style.display =
        "block";


    setTimeout(
        () => {

            message.style.display =
                "none";

        },
        2000
    );
}


/* =====================================================
   ERREUR
   ===================================================== */

function afficherErreur(message) {

    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result error";


    result.style.display =
        "block";


    result.innerHTML =
        message;
}


/* =====================================================
   SECURITE
   ===================================================== */

function escapeHtml(texte) {

    return texte
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
