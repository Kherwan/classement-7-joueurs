<body>

<div class="container">

    <a href="index.html" class="back">
        ← Retour au classement
    </a>

    <h1>📚 Ajouter les questions</h1>

    <p class="description">
        Colle ici les questions copiées depuis La Table des Savoirs.
        La page récupérera automatiquement les bonnes réponses.
    </p>

    <label for="date">Date</label>

    <input
        type="text"
        id="date"
        placeholder="Exemple : 28 août 2026"
    >

    <br><br>

    <label for="content">
        Questions + réponses
    </label>

    <textarea
        id="content"
        placeholder="Colle ici le contenu du quiz..."
    ></textarea>

    <button onclick="analyser()">
        🔍 Analyser
    </button>

    <div id="result" class="result"></div>

    <div id="preview" class="preview"></div>

    <div id="jsonSection" class="json-section">

        <h2>📄 JSON généré</h2>

        <textarea id="jsonOutput" readonly></textarea>

        <button class="secondary" onclick="copierJSON()">
            📋 Copier le JSON
        </button>

        <div id="copySuccess" class="copy-success">
            ✅ JSON copié !
        </div>

    </div>

</div>


<script>

let questionsDetectees = [];
let answersDetectees = [];


/* =====================================================
   ANALYSE PRINCIPALE
   ===================================================== */

function analyser() {

    const texte =
        document.getElementById("content").value;

    const date =
        document.getElementById("date").value.trim();

    const result =
        document.getElementById("result");

    const preview =
        document.getElementById("preview");

    const jsonSection =
        document.getElementById("jsonSection");


    questionsDetectees = [];
    answersDetectees = [];

    result.style.display = "none";
    preview.innerHTML = "";
    jsonSection.style.display = "none";


    if (!texte.trim()) {

        afficherErreur(
            "❌ Colle d'abord le contenu du quiz."
        );

        return;
    }


    /*
     * On normalise le texte.
     */

    const lignes = texte
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n")
        .map(ligne => ligne.trim());


    /*
     * -------------------------------------------------
     * ON PARCOURT LE TEXTE DANS L'ORDRE
     * -------------------------------------------------
     *
     * Pour chaque question :
     *
     * QUESTION
     *
     * réponse de l'utilisateur
     *
     * Réponse attendue : XXX
     *
     * OU
     *
     * QUESTION
     *
     * réponse de l'utilisateur
     *
     * Bonne réponse ! (XXX)
     *
     * Le point important est que la réponse utilisateur
     * est toujours ignorée.
     */


    let questionEnCours = null;
    let reponseUtilisateurTrouvee = false;


    for (let i = 0; i < lignes.length; i++) {

        const ligne = lignes[i];


        if (!ligne) {
            continue;
        }


        /*
         * ---------------------------------------------
         * 1. REPONSE ATTENDUE
         * ---------------------------------------------
         */

        const attendu =
            ligne.match(
                /^Réponse\s+attendue\s*:\s*(.+)$/i
            );


        if (attendu) {

            if (
                questionEnCours
            ) {

                questionsDetectees.push(
                    nettoyerTexte(questionEnCours)
                );

                answersDetectees.push(
                    nettoyerTexte(attendu[1])
                );

                questionEnCours = null;
                reponseUtilisateurTrouvee = false;
            }

            continue;
        }


        /*
         * ---------------------------------------------
         * 2. BONNE REPONSE
         * ---------------------------------------------
         */

        const bonne =
            ligne.match(
                /^Bonne\s+réponse\s*!\s*\((.*?)\)/i
            );


        if (bonne) {

            if (
                questionEnCours
            ) {

                questionsDetectees.push(
                    nettoyerTexte(questionEnCours)
                );

                answersDetectees.push(
                    nettoyerTexte(bonne[1])
                );

                questionEnCours = null;
                reponseUtilisateurTrouvee = false;
            }

            continue;
        }


        /*
         * ---------------------------------------------
         * 3. LIGNE INUTILE
         * ---------------------------------------------
         */

        if (
            estLigneInutile(ligne)
        ) {

            continue;
        }


        /*
         * ---------------------------------------------
         * 4. SI ON N'A PAS ENCORE DE QUESTION
         * ---------------------------------------------
         *
         * Cette ligne devient la question.
         */

        if (
            questionEnCours === null
        ) {

            questionEnCours = ligne;

            continue;
        }


        /*
         * ---------------------------------------------
         * 5. SI ON A DEJA UNE QUESTION
         * ---------------------------------------------
         *
         * La première ligne supplémentaire est
         * considérée comme la réponse donnée par
         * l'utilisateur.
         *
         * On l'ignore.
         */

        if (
            !reponseUtilisateurTrouvee
        ) {

            reponseUtilisateurTrouvee = true;

            continue;
        }


        /*
         * Une ligne supplémentaire avant la réponse
         * officielle peut faire partie de la question.
         *
         * On la rattache à la question.
         */

        questionEnCours +=
            " " + ligne;
    }


    /*
     * -------------------------------------------------
     * SUPPRESSION DES DOUBLONS
     * -------------------------------------------------
     */

    const resultatFinal = [];

    for (
        let i = 0;
        i < questionsDetectees.length;
        i++
    ) {

        const existe =
            resultatFinal.some(
                item =>
                    item.question ===
                    questionsDetectees[i]
            );


        if (!existe) {

            resultatFinal.push({

                question:
                    questionsDetectees[i],

                answer:
                    answersDetectees[i]

            });
        }
    }


    questionsDetectees =
        resultatFinal.map(
            item => item.question
        );

    answersDetectees =
        resultatFinal.map(
            item => item.answer
        );


    afficherResultat(date);
}


/* =====================================================
   DETECTION DES LIGNES A IGNORER
   ===================================================== */

function estLigneInutile(ligne) {

    const texte =
        ligne
            .replace(/\*\*/g, "")
            .trim();


    if (!texte) {
        return true;
    }


    /*
     * Réponse utilisateur en gras
     *
     * **Doha**
     * **Freddi mercurie**
     * **Jard**
     */

    if (
        ligne.startsWith("**") &&
        ligne.endsWith("**")
    ) {

        return true;
    }


    /*
     * Scores
     */

    if (
        /^\d+\s*\/\s*\**30\s*pts/i.test(texte)
    ) {

        return true;
    }


    if (
        /^\d+\s*\/\s*\**100\s*pts/i.test(texte)
    ) {

        return true;
    }


    /*
     * Pourcentages
     */

    if (
        /^\d+[,.]\d+\s*%$/.test(texte)
    ) {

        return true;
    }


    /*
     * Contestation
     */

    if (
        texte
            .toLowerCase()
            .includes(
                "contestation en cours"
            )
    ) {

        return true;
    }


    return false;
}


/* =====================================================
   NETTOYAGE
   ===================================================== */

function nettoyerTexte(texte) {

    return texte
        .replace(/\*\*/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/* =====================================================
   AFFICHAGE DU RESULTAT
   ===================================================== */

function afficherResultat(date) {

    const result =
        document.getElementById("result");


    result.style.display = "block";


    if (
        questionsDetectees.length === 10 &&
        answersDetectees.length === 10
    ) {

        result.className =
            "result success";


        result.innerHTML = `
            ✅ <strong>10 questions détectées !</strong><br>
            ✅ <strong>10 bonnes réponses détectées !</strong><br><br>
            Les réponses données ont été ignorées.
        `;

    } else {

        result.className =
            "result error";


        result.innerHTML = `
            ⚠️ <strong>Détection incomplète</strong><br><br>

            Questions détectées :
            <strong>${questionsDetectees.length}</strong><br>

            Bonnes réponses détectées :
            <strong>${answersDetectees.length}</strong><br><br>

            Il faut normalement 10 questions et
            10 bonnes réponses.
        `;
    }


    afficherPreview();


    if (
        questionsDetectees.length > 0
    ) {

        genererJSON(date);
    }
}


/* =====================================================
   APERCU
   ===================================================== */

function afficherPreview() {

    const preview =
        document.getElementById("preview");


    if (
        questionsDetectees.length === 0
    ) {

        return;
    }


    preview.innerHTML =
        "<h2>👀 Aperçu</h2>";


    questionsDetectees.forEach(
        (question, index) => {

            const bloc =
                document.createElement("div");


            bloc.className =
                "question";


            bloc.innerHTML = `

                <div class="number">
                    Question ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHtml(question)}
                </div>

                <div class="answer">
                    Réponse :
                    ${escapeHtml(
                        answersDetectees[index]
                    )}
                </div>

            `;


            preview.appendChild(bloc);
        }
    );
}


/* =====================================================
   GENERATION JSON
   ===================================================== */

function genererJSON(date) {

    const jsonSection =
        document.getElementById(
            "jsonSection"
        );

    const jsonOutput =
        document.getElementById(
            "jsonOutput"
        );


    const jour = {

        date:
            date ||
            "Date inconnue",

        questions:
            questionsDetectees.map(
                (question, index) => {

                    return {

                        question:
                            question,

                        answer:
                            answersDetectees[index]

                    };

                }
            )
    };


    jsonOutput.value =
        JSON.stringify(
            jour,
            null,
            2
        );


    jsonSection.style.display =
        "block";
}


/* =====================================================
   COPIER LE JSON
   ===================================================== */

async function copierJSON() {

    const json =
        document.getElementById(
            "jsonOutput"
        ).value;


    const message =
        document.getElementById(
            "copySuccess"
        );


    try {

        await navigator.clipboard.writeText(
            json
        );

    } catch (error) {

        const textarea =
            document.getElementById(
                "jsonOutput"
            );

        textarea.select();

        document.execCommand("copy");
    }


    message.style.display =
        "block";


    setTimeout(
        () => {

            message.style.display =
                "none";

        },
        2000
    );
}


/* =====================================================
   ERREUR
   ===================================================== */

function afficherErreur(message) {

    const result =
        document.getElementById(
            "result"
        );


    result.className =
        "result error";

    result.style.display =
        "block";

    result.innerHTML =
        message;
}


/* =====================================================
   SECURITE HTML
   ===================================================== */

function escapeHtml(texte) {

    return texte
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
