<script>

function analyser() {

    const texte = document.getElementById("content").value;
    const result = document.getElementById("result");
    const preview = document.getElementById("preview");

    result.style.display = "block";
    preview.innerHTML = "";

    /*
     * On cherche uniquement le texte
     * "Réponse attendue :" sans se soucier
     * des éventuels ** autour.
     */

    const regex =
        /Réponse\s+attendue\s*:\s*([^\n\r]+)/gi;

    const matches = [...texte.matchAll(regex)];

    const answers = matches.map(match =>
        match[1]
            .replace(/\*\*/g, "")
            .trim()
    );

    /*
     * Affichage du résultat
     */

    if (answers.length === 10) {

        result.className = "result success";

        result.innerHTML = `
            ✅ <strong>10 réponses détectées !</strong><br><br>
            Le format est maintenant reconnu.
        `;

        preview.innerHTML = "<h2>👀 Réponses trouvées</h2>";

        answers.forEach((answer, index) => {

            const div = document.createElement("div");

            div.className = "question";

            div.innerHTML = `
                <div class="number">
                    Question ${index + 1}
                </div>

                <div class="answer">
                    ${escapeHtml(answer)}
                </div>
            `;

            preview.appendChild(div);
        });

    } else {

        result.className = "result error";

        result.innerHTML = `
            ❌ Le détecteur trouve seulement
            <strong>${answers.length} réponse(s)</strong>.<br><br>

            Il devrait en trouver 10.
        `;

        /*
         * Diagnostic supplémentaire :
         * on affiche ce que le navigateur reçoit
         * réellement.
         */

        preview.innerHTML = `
            <h2>🔎 Diagnostic</h2>

            <p>
                Le navigateur ne reconnaît pas les lignes
                "Réponse attendue".
            </p>

            <p>
                <strong>Texte reçu :</strong>
            </p>

            <pre style="
                white-space: pre-wrap;
                background: #f7f7f7;
                padding: 15px;
                border-radius: 8px;
                overflow-x: auto;
            ">${escapeHtml(texte.substring(0, 2000))}</pre>
        `;
    }
}


function escapeHtml(texte) {

    return texte
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>
