<div class="container">

    <a href="index.html" class="back">
        ← Retour au classement
    </a>

    <h1>📚 Ajouter les questions</h1>

    <p class="description">
        Colle ici les questions copiées depuis La Table des Savoirs.
        La page récupérera automatiquement les bonnes réponses.
    </p>

    <label for="date">
        Date
    </label>

    <input
        type="text"
        id="date"
        placeholder="Exemple : 27 août 2026"
    >

    <br><br>

    <label for="content">
        Questions + réponses
    </label>

    <textarea
        id="content"
        placeholder="Colle ici le contenu du quiz..."
    ></textarea>

    <button onclick="analyser()">
        🔍 Analyser
    </button>

    <div id="result" class="result"></div>

    <div id="preview" class="preview"></div>

    <div id="jsonSection" class="json-section">

        <h2>📄 JSON généré</h2>

        <textarea
            id="jsonOutput"
            readonly
        ></textarea>

        <button
            class="secondary"
            onclick="copierJSON()"
        >

        </button>

<script>

let questionsDetectees = [];
let answersDetectees = [];


/*
 * =====================================================
 * ANALYSE PRINCIPALE
 * =====================================================
 */

function analyser() {

    const texte =
        document.getElementById("content").value;

    const date =
        document.getElementById("date").value.trim();

    const result =
        document.getElementById("result");

    const preview =
        document.getElementById("preview");

    const jsonSection =
        document.getElementById("jsonSection");


    result.style.display = "none";
    preview.innerHTML = "";
    jsonSection.style.display = "none";


    questionsDetectees = [];
    answersDetectees = [];


    if (!texte.trim()) {

        afficherErreur(
            "❌ Colle d'abord le contenu du quiz."
        );

        return;
    }


    /*
     * -------------------------------------------------
     * On normalise le texte.
     * -------------------------------------------------
     */

    const lignes = texte
        .replace(/\r\n/g, "\n")
        .replace(/\r/g, "\n")
        .split("\n");


    /*
     * =================================================
     * 1. NOUVEAU FORMAT
     * =================================================
     *
     * Exemple :
     *
     * Question
     *
     * **Renoir**
     *
     * Réponse attendue : Edgar Degas
     *
     * 0 / 30 pts
     *
     * OU :
     *
     * Question
     *
     * **Tee**
     *
     * Bonne réponse ! (Tee)
     *
     * 30 / 30 pts
     */


    let blocs = [];

    let blocActuel = [];


    for (const ligne of lignes) {

        if (ligne.trim() === "") {

            if (blocActuel.length > 0) {

                blocs.push(blocActuel);

                blocActuel = [];
            }

        } else {

            blocActuel.push(ligne);
        }
    }


    if (blocActuel.length > 0) {
        blocs.push(blocActuel);
    }


    /*
     * -------------------------------------------------
     * Chaque question est normalement constituée
     * de plusieurs blocs séparés par des lignes vides.
     *
     * On repère les blocs contenant :
     *
     * "Réponse attendue"
     *
     * ou
     *
     * "Bonne réponse"
     * -------------------------------------------------
     */


    for (let i = 0; i < blocs.length; i++) {

        const bloc =
            blocs[i].join("\n");


        /*
         * ---------------------------------------------
         * CAS 1 :
         * Réponse attendue
         * ---------------------------------------------
         */

        const attendu =
            bloc.match(
                /Réponse\s+attendue\s*:\s*(.+)/i
            );


        /*
         * ---------------------------------------------
         * CAS 2 :
         * Bonne réponse
         * ---------------------------------------------
         */

        const bonne =
            bloc.match(
                /Bonne\s+réponse\s*!\s*\((.*?)\)/i
            );


        /*
         * Si ce bloc ne contient aucune indication
         * de réponse, ce n'est pas encore une question.
         */

        if (!attendu && !bonne) {
            continue;
        }


        /*
         * Bonne réponse officielle.
         */

        let answer = "";


        if (attendu) {

            answer =
                attendu[1]
                    .replace(/\*\*/g, "")
                    .trim();

        } else if (bonne) {

            answer =
                bonne[1]
                    .replace(/\*\*/g, "")
                    .trim();

        }


        /*
         * ---------------------------------------------
         * On cherche la question.
         *
         * Elle se trouve généralement dans le bloc
         * précédent.
         * ---------------------------------------------
         */

        let question = "";


        /*
         * On regarde d'abord le bloc précédent.
         */

        if (i > 0) {

            question =
                blocs[i - 1]
                    .join(" ")
                    .replace(/\*\*/g, "")
                    .trim();
        }


        /*
         * Si le bloc précédent correspond à une réponse
         * utilisateur ou à un score, on remonte davantage.
         */

        let recherche = i - 1;


        while (
            recherche >= 0 &&
            estBlocInutile(
                blocs[recherche].join(" ")
            )
        ) {

            recherche--;
        }


        if (recherche >= 0) {

            question =
                blocs[recherche]
                    .join(" ")
                    .replace(/\*\*/g, "")
                    .trim();
        }


        /*
         * Nettoyage de la question.
         */

        question =
            nettoyerQuestion(question);


        if (
            question.length > 5 &&
            answer.length > 0
        ) {

            questionsDetectees.push(question);

            answersDetectees.push(answer);
        }
    }


    /*
     * =================================================
     * 2. FALLBACK ANCIEN FORMAT
     * =================================================
     *
     * Si jamais le nouveau format n'a pas fonctionné,
     * on tente l'ancien :
     *
     * Réponse attendue : XXXXX
     */


    if (
        questionsDetectees.length === 0 &&
        answersDetectees.length === 0
    ) {

        analyserAncienFormat(lignes);
    }


    /*
     * =================================================
     * 3. RESULTAT
     * =================================================
     */

    afficherResultat(date);
}


/*
 * =====================================================
 * DÉTECTION ANCIEN FORMAT
 * =====================================================
 */

function analyserAncienFormat(lignes) {

    for (
        let i = 0;
        i < lignes.length;
        i++
    ) {

        const ligne =
            lignes[i].trim();


        const match =
            ligne.match(
                /Réponse\s+attendue\s*:\s*(.+)/i
            );


        if (!match) {
            continue;
        }


        const answer =
            match[1]
                .replace(/\*\*/g, "")
                .trim();


        let j = i - 1;


        while (
            j >= 0 &&
            lignes[j].trim() === ""
        ) {
            j--;
        }


        /*
         * Pas de réponse
         */

        if (
            j >= 0 &&
            lignes[j]
                .toLowerCase()
                .includes("pas de réponse")
        ) {

            j--;
        }


        while (
            j >= 0 &&
            lignes[j].trim() === ""
        ) {
            j--;
        }


        let question = "";


        while (
            j >= 0 &&
            lignes[j].trim() !== ""
        ) {

            const ligneQuestion =
                lignes[j].trim();


            if (
                !/^\*\*\s*[?0-9]+\s*\/\s*30\s*pts/i
                    .test(ligneQuestion)
            ) {

                question =
                    ligneQuestion
                        .replace(/\*\*/g, "")
                        .trim();
            }


            j--;
        }


        if (
            question.length > 5 &&
            answer.length > 0
        ) {

            questionsDetectees.push(question);

            answersDetectees.push(answer);
        }
    }
}


/*
 * =====================================================
 * IDENTIFICATION DES BLOCS INUTILES
 * =====================================================
 */

function estBlocInutile(texte) {

    const t =
        texte
            .toLowerCase()
            .trim();


    if (!t) {
        return true;
    }


    if (
        t.includes("réponse attendue")
    ) {
        return true;
    }


    if (
        t.includes("bonne réponse")
    ) {
        return true;
    }


    if (
        t.includes("contestation en cours")
    ) {
        return true;
    }


    if (
        /^\*\*?.*\*\*?$/.test(t) &&
        t.length < 100
    ) {

        /*
         * Peut être la réponse donnée par
         * l'utilisateur.
         */

        return true;
    }


    if (
        /\d+\s*\/\s*\**30\s*pts/i.test(t)
    ) {
        return true;
    }


    if (
        /\d+[,.]\d+\s*%/.test(t)
    ) {
        return true;
    }


    return false;
}


/*
 * =====================================================
 * NETTOYAGE DES QUESTIONS
 * =====================================================
 */

function nettoyerQuestion(question) {

    return question
        .replace(/\*\*/g, "")
        .replace(/\s+/g, " ")
        .trim();
}


/*
 * =====================================================
 * AFFICHAGE DU RESULTAT
 * =====================================================
 */

function afficherResultat(date) {

    const result =
        document.getElementById("result");


    result.style.display = "block";


    if (
        questionsDetectees.length === 10 &&
        answersDetectees.length === 10
    ) {

        result.className =
            "result success";


        result.innerHTML = `
            ✅ <strong>10 questions détectées</strong><br>
            ✅ <strong>10 bonnes réponses détectées</strong><br><br>
            Vérifie l'aperçu ci-dessous.
        `;


        afficherPreview();


        genererJSON(date);


    } else {

        result.className =
            "result error";


        result.innerHTML = `
            ⚠️ <strong>Détection incomplète</strong><br><br>

            Questions détectées :
            <strong>${questionsDetectees.length}</strong><br>

            Bonnes réponses détectées :
            <strong>${answersDetectees.length}</strong><br><br>

            Il faut normalement 10 questions et
            10 bonnes réponses.
        `;


        afficherPreview();
    }
}


/*
 * =====================================================
 * APERCU
 * =====================================================
 */

function afficherPreview() {

    const preview =
        document.getElementById("preview");


    if (
        questionsDetectees.length === 0
    ) {
        return;
    }


    preview.innerHTML =
        "<h2>👀 Aperçu</h2>";


    questionsDetectees.forEach(
        (question, index) => {

            const bloc =
                document.createElement("div");


            bloc.className =
                "question";


            bloc.innerHTML = `
                <div class="number">
                    Question ${index + 1}
                </div>

                <div class="question-text">
                    ${escapeHtml(question)}
                </div>

                <div class="answer">
                    Réponse :
                    ${escapeHtml(
                        answersDetectees[index]
                    )}
                </div>
            `;


            preview.appendChild(bloc);
        }
    );
}


/*
 * =====================================================
 * GENERATION JSON
 * =====================================================
 */

function genererJSON(date) {

    const jsonSection =
        document.getElementById("jsonSection");


    const jsonOutput =
        document.getElementById("jsonOutput");


    const jour = {

        date:
            date || "Date inconnue",

        questions:
            questionsDetectees.map(
                (question, index) => {

                    return {

                        question:
                            question,

                        answer:
                            answersDetectees[index]

                    };

                }
            )

    };


    jsonOutput.value =
        JSON.stringify(
            jour,
            null,
            2
        );


    jsonSection.style.display =
        "block";
}


/*
 * =====================================================
 * COPIER JSON
 * =====================================================
 */

async function copierJSON() {

    const json =
        document.getElementById(
            "jsonOutput"
        ).value;


    const message =
        document.getElementById(
            "copySuccess"
        );


    try {

        await navigator.clipboard.writeText(
            json
        );

    } catch (error) {

        const textarea =
            document.getElementById(
                "jsonOutput"
            );

        textarea.select();

        document.execCommand("copy");
    }


    message.style.display =
        "block";


    setTimeout(
        () => {

            message.style.display =
                "none";

        },
        2000
    );
}


/*
 * =====================================================
 * ERREUR
 * =====================================================
 */

function afficherErreur(message) {

    const result =
        document.getElementById("result");


    result.className =
        "result error";


    result.style.display =
        "block";


    result.innerHTML =
        message;
}


/*
 * =====================================================
 * SECURITE HTML
 * =====================================================
 */

function escapeHtml(texte) {

    return texte
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

</script>

</body>
</html>
