<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — Table des Savoirs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:      #fdfbf3;
    --ink:     #26303d;
    --ink-dim: #6b7280;
    --card:    #ffffff;
    --line:    #ece5d3;

    --blue:    #3374ac;
    --pink:    #e1507e;
    --yellow:  #eab834;
    --green:   #4c9a6a;
    --orange:  #e77f34;
    --purple:  #8a5fac;

    --gold:    #d7a72c;
    --silver:  #a9adb4;
    --bronze:  #bd7a45;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 50px 18px 80px;
    background: var(--bg);
    color: var(--ink);
    font-family: "Work Sans", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.16;
    z-index: 0;
  }

  body::before {
    background: var(--blue);
    top: -160px;
    left: -140px;
  }

  body::after {
    background: var(--pink);
    top: -100px;
    right: -180px;
  }

  .page {
    position: relative;
    z-index: 1;
    max-width: 600px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 6px;
  }

  .wheel {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    flex: none;
    background: conic-gradient(
      var(--blue) 0deg 60deg,
      var(--pink) 60deg 120deg,
      var(--yellow) 120deg 180deg,
      var(--green) 180deg 240deg,
      var(--orange) 240deg 300deg,
      var(--purple) 300deg 360deg
    );
    box-shadow: 0 0 0 4px #fff, 0 2px 8px rgba(38,48,61,0.18);
  }

  .masthead h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 700;
    font-size: 34px;
    margin: 0;
    line-height: 1;
  }

  .subtitle {
    margin: 10px 0 28px;
    color: var(--ink-dim);
    font-size: 15px;
  }

  .archives-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 30px;
    padding: 11px 18px;
    background: var(--ink);
    color: #fff;
    text-decoration: none;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 14.5px;
    border-radius: 999px;
  }

  .archives-link:hover {
    background: #384254;
  }

  .archives-link::after {
    content: "→";
  }

  /* --- Classement --- */

  .board {
    background: var(--card);
    border-radius: 18px;
    border: 1px solid var(--line);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 15px 20px;
    border-top: 1px solid var(--line);
  }

  .row:first-child {
    border-top: none;
  }

  .badge {
    flex: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 15px;
    background: #d8dde3;
    color: var(--ink);
  }

  .row.rank-1 .badge { background: var(--gold); color: #fff; }
  .row.rank-2 .badge { background: var(--silver); color: #fff; }
  .row.rank-3 .badge { background: var(--bronze); color: #fff; }

  .name {
    flex: 1;
    font-weight: 600;
    font-size: 16.5px;
  }

  .scores {
    text-align: right;
    flex: none;
  }

  .points {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 16px;
  }

  .points span {
    font-family: "Work Sans", sans-serif;
    font-weight: 400;
    font-size: 12.5px;
    color: var(--ink-dim);
  }

  .general-rank {
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .status {
    color: var(--ink-dim);
    font-size: 14px;
    padding: 20px 4px;
  }

  .error {
    background: #fbe6e2;
    color: #93372a;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 14px;
  }

  .updated {
    margin-top: 20px;
    color: var(--ink-dim);
    font-size: 12.5px;
  }

  @media (max-width: 480px) {
    .masthead h1 { font-size: 27px; }
    .wheel { width: 34px; height: 34px; }
    .name { font-size: 15px; }
  }
</style>
</head>

<body>

<div class="page">

  <div class="masthead">
    <div class="wheel"></div>
    <h1>Classement</h1>
  </div>
  <p class="subtitle">Table des Savoirs — Saison 8</p>

  <a class="archives-link" href="questions.html">Questions des jours précédents</a>

  <div id="players" class="status">Chargement…</div>

  <div class="updated" id="updated"></div>

</div>

<script>

async function loadRanking() {

  const playersContainer = document.getElementById("players");
  const updated = document.getElementById("updated");

  try {

    const response = await fetch("classement.json");

    if (!response.ok) {
      throw new Error("Impossible de récupérer le classement");
    }

    const data = await response.json();

    playersContainer.className = "board";
    playersContainer.innerHTML = "";

    data.players.forEach((player, index) => {

      const rank = index + 1;
      const row = document.createElement("div");
      row.className = "row" + (rank <= 3 ? ` rank-${rank}` : "");

      row.innerHTML = `
        <div class="badge">${rank}</div>
        <div class="name">${player.username}</div>
        <div class="scores">
          <div class="points">${player.score ?? "—"} <span>pts</span></div>
          <div class="general-rank">Classement général #${player.rank ?? "—"}</div>
        </div>
      `;

      playersContainer.appendChild(row);
    });

    const date = new Date(data.updated_at);

    updated.textContent =
      "Dernière mise à jour : " + date.toLocaleString("fr-FR");

  } catch (error) {

    playersContainer.className = "";
    playersContainer.innerHTML = `<div class="error">Erreur : ${error.message}</div>`;

    console.error(error);
  }
}

loadRanking();

</script>

</body>
</html>
