<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classement — Table des Savoirs</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --ink:        #1c2b20;
    --ink-soft:   #26392c;
    --paper:      #f2ead4;
    --paper-dim:  #e7dcb9;
    --line:       #cdbd8f;
    --text:       #2a2013;
    --text-dim:   #6b5f47;
    --brass:      #a9762f;
    --brass-dark: #7c5722;
    --gold:       #c99a3f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 56px 20px 90px;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 85% 8%, var(--ink-soft), transparent 55%);
    color: var(--text);
    font-family: "Source Serif 4", Georgia, serif;
  }

  .page {
    max-width: 620px;
    margin: 0 auto;
  }

  .masthead {
    color: var(--paper);
    margin-bottom: 34px;
  }

  .masthead h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 42px;
    line-height: 1.05;
    margin: 0 0 10px;
  }

  .masthead p {
    margin: 0;
    color: var(--paper-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
  }

  .archives-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
    padding: 10px 16px;
    background: var(--brass);
    color: var(--ink);
    text-decoration: none;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    font-weight: 500;
    border-radius: 3px;
  }

  .archives-link:hover {
    background: var(--gold);
  }

  .archives-link::before {
    content: "→";
  }

  /* --- Registre des scores --- */

  .board {
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.18);
    overflow: hidden;
  }

  .row {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 16px 24px;
    border-top: 1px solid var(--line);
  }

  .row:first-child {
    border-top: none;
  }

  .row.top .rank-num {
    color: var(--brass-dark);
  }

  .rank-num {
    font-family: "IBM Plex Mono", monospace;
    font-size: 15px;
    color: var(--text-dim);
    width: 26px;
    flex: none;
  }

  .name {
    flex: 1;
    font-size: 18px;
    font-weight: 600;
  }

  .scores {
    text-align: right;
    flex: none;
  }

  .points {
    font-size: 17px;
    font-weight: 600;
  }

  .points span {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
  }

  .general-rank {
    font-family: "IBM Plex Mono", monospace;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .status {
    color: var(--paper-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    padding: 24px 0;
  }

  .error {
    background: #3a2420;
    color: #f2d9d0;
    padding: 16px 18px;
    border-left: 3px solid #b25c48;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
  }

  .updated {
    margin-top: 22px;
    color: var(--paper-dim);
    font-family: "IBM Plex Mono", monospace;
    font-size: 12.5px;
  }

  @media (max-width: 480px) {
    body { padding: 40px 14px 70px; }
    .masthead h1 { font-size: 33px; }
    .name { font-size: 16.5px; }
  }
</style>
</head>

<body>

<div class="page">

  <div class="masthead">
    <h1>Classement</h1>
    <p>Table des Savoirs — Saison 8</p>
  </div>

  <a class="archives-link" href="questions.html">Questions des jours précédents</a>

  <div id="players" class="status">Chargement…</div>

  <div class="updated" id="updated"></div>

</div>

<script>

async function loadRanking() {

  const playersContainer = document.getElementById("players");
  const updated = document.getElementById("updated");

  try {

    const response = await fetch("classement.json");

    if (!response.ok) {
      throw new Error("Impossible de récupérer le classement");
    }

    const data = await response.json();

    playersContainer.className = "board";
    playersContainer.innerHTML = "";

    data.players.forEach((player, index) => {

      const row = document.createElement("div");
      row.className = "row" + (index < 3 ? " top" : "");

      row.innerHTML = `
        <div class="rank-num">${index + 1}</div>
        <div class="name">${player.username}</div>
        <div class="scores">
          <div class="points">${player.score ?? "—"} <span>pts</span></div>
          <div class="general-rank">Classement général #${player.rank ?? "—"}</div>
        </div>
      `;

      playersContainer.appendChild(row);
    });

    const date = new Date(data.updated_at);

    updated.textContent =
      "Dernière mise à jour : " + date.toLocaleString("fr-FR");

  } catch (error) {

    playersContainer.className = "";
    playersContainer.innerHTML = `<div class="error">Erreur : ${error.message}</div>`;

    console.error(error);
  }
}

loadRanking();

</script>

</body>
</html>
